<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#33200F"/>
      <stop offset="0.55" stop-color="#241610"/>
      <stop offset="1" stop-color="#1A100B"/>
    </linearGradient>

    <radialGradient id="cardGlow" cx="0" cy="0" r="1"
      gradientTransform="translate(300 315) rotate(-90) scale(430 400)"
      gradientUnits="userSpaceOnUse">
      <stop stop-color="#E2732C" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#E2732C" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5A3821"/>
      <stop offset="0.55" stop-color="#42271A"/>
      <stop offset="1" stop-color="#2E1B12"/>
    </linearGradient>

    <radialGradient id="hearth" cx="0" cy="0" r="1"
      gradientTransform="translate(256 336) rotate(-90) scale(224 208)"
      gradientUnits="userSpaceOnUse">
      <stop stop-color="#E2732C" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#E2732C" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="flame" x1="256" y1="70" x2="256" y2="366" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD27A"/>
      <stop offset="0.42" stop-color="#F0913A"/>
      <stop offset="1" stop-color="#C9501E"/>
    </linearGradient>

    <linearGradient id="core" x1="256" y1="206" x2="256" y2="342" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF3D2"/>
      <stop offset="1" stop-color="#FFC062"/>
    </linearGradient>

    <linearGradient id="wood" x1="140" y1="392" x2="372" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D6A874"/>
      <stop offset="1" stop-color="#9C6E44"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#card)"/>
  <rect width="1200" height="630" fill="url(#cardGlow)"/>

  <!-- The app mark, sitting on its own tile so it reads against the card -->
  <g transform="translate(96 151) scale(0.640625)">
    <rect width="512" height="512" rx="116" fill="url(#bg)"/>
    <rect width="512" height="512" rx="116" fill="url(#hearth)"/>
    <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none"
      stroke="#F0913A" stroke-opacity="0.22" stroke-width="3"/>

    <g stroke="url(#wood)" stroke-linecap="round" stroke-width="30">
      <path d="M150 428 L362 386"/>
      <path d="M150 386 L362 428"/>
    </g>

    <path
      d="M256 66
         C 256 118, 244 150, 236 172
         C 227 197, 240 214, 258 209
         C 278 203, 291 176, 288 132
         C 322 168, 344 205, 344 250
         C 344 316, 305 358, 256 358
         C 207 358, 168 316, 168 250
         C 168 176, 226 116, 256 66 Z"
      fill="url(#flame)"/>

    <path
      d="M258 206
         C 258 206, 214 250, 214 292
         C 214 328, 233 348, 257 348
         C 281 348, 300 328, 300 292
         C 300 250, 258 206, 258 206 Z"
      fill="url(#core)"/>
  </g>

  <!-- Wordmark and promise -->
  <text x="492" y="272" font-family="Georgia, 'Times New Roman', serif" font-size="104"
    font-weight="bold" fill="#FDF3E4" letter-spacing="-2">Kindling</text>

  <text x="496" y="342" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="42"
    fill="#F0AE6A">Find a project worth building.</text>

  <text x="496" y="424" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="27"
    fill="#C4A98F">A few plain questions, then three project ideas</text>
  <text x="496" y="462" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="27"
    fill="#C4A98F">shaped around you. No account needed.</text>

  <!-- Ember rule, echoing the flame gradient -->
  <rect x="496" y="506" width="188" height="6" rx="3" fill="#E2732C" fill-opacity="0.85"/>
</svg>
