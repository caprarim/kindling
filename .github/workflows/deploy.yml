name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static site
        env:
          # GitHub Pages serves a project site from /<repo>.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Set this repository variable to the deployed Worker URL to switch
          # accounts on. Without it the site builds fine and runs guest-only.
          NEXT_PUBLIC_KINDLING_API: ${{ vars.NEXT_PUBLIC_KINDLING_API }}
        run: npm run build

      - name: Stop Pages running the output through Jekyll
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
